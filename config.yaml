filters:
    title_keywords:
        - software engineer
        - software developer
        - software development engineer
        - backend
        - golang
        - python
        - distributed systems
        - member of technical staff
        - ai engineer
        - agentic ai engineer
        - mts
        - sde
        - swe
    title_exclude_keywords:
        - manager
        - intern
        - staff software engineer
        - staff member of technical staff
        - director
        - principal
        - scientist
        - full stack
        - full-stack
        - ios
        - android
        - frontend
        - embedded
        - forward deployed
        - sr staff
    locations:
        - United States
        - United States of America
        - US
        - USA
        - Remote
        - San Francisco
        - CA
        - California
        - New York
        - NY
        - San Jose
    exclude_locations:
        - Canada
        - Cairo
        - Germany
        - Denmark
    max_age: 24h
